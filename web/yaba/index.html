<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<base href="/" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover"
		/>
		<meta name="color-scheme" content="dark light" />
		<title>YABA - Faction Activity Report</title>
		<script>
			// Match the dashboard's persisted theme before first paint.
			(() => {
				var stored, theme, root;
				try {
					stored = localStorage.getItem("sentinel-theme");
					theme = stored === "light" || stored === "dark" ? stored : "dark";
					root = document.documentElement;
					root.setAttribute("data-theme", theme);
					root.classList.toggle("dark", theme === "dark");
					root.style.backgroundColor =
						theme === "light" ? "#f8fafc" : "#060911";
				} catch (_e) {
					document.documentElement.setAttribute("data-theme", "dark");
					document.documentElement.classList.add("dark");
				}
			})();
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body style="margin: 0; background: #060911">
		<div id="root"></div>
		<script type="module" src="./src/main.tsx"></script>
	</body>
</html>
