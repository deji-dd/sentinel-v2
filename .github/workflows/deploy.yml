name: Deploy to Production

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "docs/**"
      - ".gitignore"

permissions:
  contents: read
  packages: write

jobs:
  validate-and-test:
    name: Validate & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sentinel_db
          POSTGRES_USER: sentinel_user
          POSTGRES_PASSWORD: e63af385d45ae76c4a8b90b995c2cf1d8c0cf6ca444d3985
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: sentinel_db
      POSTGRES_USER: sentinel_user
      POSTGRES_PASSWORD: e63af385d45ae76c4a8b90b995c2cf1d8c0cf6ca444d3985

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Typecheck
        run: bun run typecheck

      - name: Run Linter
        run: bun run lint

      - name: Build Web Dashboards
        run: bun run web:build

      - name: Run Database Migrations
        run: bun run db:migrate

      - name: Run Tests
        run: bun test

  build-and-push:
    name: Build & Push Container Image
    needs: validate-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to dejis-cloud
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: dejis-cloud
      SERVER_USER: root
      DEPLOY_DIR: /opt/sentinel-v2

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup Server Directories
        run: |
          ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} "bash -s" << EOF
            set -euo pipefail
            echo "Ensuring deployment directory exists..."
            mkdir -p "${DEPLOY_DIR}"
          EOF

      - name: Sync Docker Compose Configuration
        run: |
          echo "Syncing docker-compose.yml to ${SERVER_HOST}:${DEPLOY_DIR}..."
          scp -o StrictHostKeyChecking=no docker-compose.yml ${SERVER_USER}@${SERVER_HOST}:${DEPLOY_DIR}/docker-compose.yml

      - name: Deploy Containers with Docker Compose
        run: |
          ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} "bash -s" << EOF
            set -euo pipefail
            cd ${DEPLOY_DIR}
            echo "Pulling updated Docker image from ghcr.io..."
            docker compose pull
            echo "Running database migrations..."
            docker compose run -T --rm sentinel-api bun run db:migrate </dev/null
            echo "Recreating containers with updated code..."
            docker compose up -d --remove-orphans
            echo "Checking Sentinel v2 container status..."
            docker compose ps
          EOF

      - name: Health Check Verification
        run: |
          ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} "bash -s" << EOF
            set -euo pipefail
            cd ${DEPLOY_DIR}
            if ! curl -f --retry 10 --retry-delay 2 --retry-connrefused http://localhost:3002/api/health; then
              echo "Healthcheck failed! Dumping container status and logs:"
              docker compose ps
              docker compose logs --tail 50
              exit 1
            fi
            echo "Healthcheck passed successfully!"
          EOF
