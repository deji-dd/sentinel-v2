name: Deploy to Production

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "docs/**"
      - ".gitignore"

jobs:
  validate-and-build:
    name: Validate & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Migrate SQLite Schema for Tests
        run: bun run db:migrate

      - name: Run Typecheck
        run: bun run typecheck

      - name: Run Linter
        run: bun run lint

      - name: Build Web Dashboards
        run: bun run web:build

      - name: Upload Web Dashboard Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: |
            web/bot-dashboard/dist
            web/user-dashboard/dist
            web/tt-selector/dist

      - name: Run Unit Tests
        run: bun test

  deploy:
    name: Deploy to VPS
    needs: validate-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Web Dashboard Artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GCP_SSH_KEY }}

      - name: Add Known Hosts
        run: |
          mkdir -p ~/.ssh
          for i in {1..5}; do
            ssh-keyscan -T 10 -H ${{ secrets.GCP_HOST }} >> ~/.ssh/known_hosts && break || sleep 2
          done

      - name: Pull Latest Changes on VPS
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 ${{ secrets.GCP_USERNAME }}@${{ secrets.GCP_HOST }} 'bash -s' << 'EOF'
            set -e
            # Terminate any orphaned build/compiler processes from previous hung runs
            pkill -f "vite|tsc" || true

            TARGET_DIR="/opt/sentinel-v2"

            if [ ! -d "$TARGET_DIR/.git" ]; then
              echo "Directory $TARGET_DIR does not exist or is not a git repo. Initializing..."
              sudo mkdir -p "$TARGET_DIR"
              sudo chown -R $USER:$USER "$TARGET_DIR"
              git clone https://github.com/ayodejib/sentinel-v2.git "$TARGET_DIR"
            fi

            cd "$TARGET_DIR"
            echo "Pulling latest changes from main..."
            git fetch origin main
            git reset --hard origin/main
          EOF

      - name: Install Production Dependencies on VPS
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 ${{ secrets.GCP_USERNAME }}@${{ secrets.GCP_HOST }} 'bash -s' << 'EOF'
            set -e
            export PATH="$HOME/.bun/bin:$PATH"
            cd /opt/sentinel-v2
            echo "Installing dependencies..."
            bun install --production
          EOF

      - name: Run SQLite Database Migrations on VPS
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 ${{ secrets.GCP_USERNAME }}@${{ secrets.GCP_HOST }} 'bash -s' << 'EOF'
            set -e
            export PATH="$HOME/.bun/bin:$PATH"
            cd /opt/sentinel-v2
            echo "Running SQLite Database Migrations..."
            bun run db:migrate
          EOF

      - name: Sync Pre-built Web Dashboards to VPS
        run: |
          echo "Syncing bot-dashboard..."
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=accept-new" \
            web/bot-dashboard/dist/ \
            ${{ secrets.GCP_USERNAME }}@${{ secrets.GCP_HOST }}:/opt/sentinel-v2/web/bot-dashboard/dist/

          echo "Syncing user-dashboard..."
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=accept-new" \
            web/user-dashboard/dist/ \
            ${{ secrets.GCP_USERNAME }}@${{ secrets.GCP_HOST }}:/opt/sentinel-v2/web/user-dashboard/dist/

          echo "Syncing tt-selector..."
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=accept-new" \
            web/tt-selector/dist/ \
            ${{ secrets.GCP_USERNAME }}@${{ secrets.GCP_HOST }}:/opt/sentinel-v2/web/tt-selector/dist/

      - name: Update & Restart Systemd Services on VPS
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 ${{ secrets.GCP_USERNAME }}@${{ secrets.GCP_HOST }} 'bash -s' << 'EOF'
            set -e
            cd /opt/sentinel-v2
            echo "Updating Systemd Services..."
            sudo cp .systemd/*.service /etc/systemd/system/
            sudo systemctl daemon-reload
            sudo systemctl enable sentinel-api sentinel-bot sentinel-scheduler
            sudo systemctl restart sentinel-api sentinel-bot sentinel-scheduler
          EOF
