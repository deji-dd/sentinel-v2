name: Deploy to Production

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "docs/**"
      - ".gitignore"

jobs:
  validate-and-build:
    name: Validate & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Migrate SQLite Schema for Tests
        run: bun run db:migrate

      - name: Run Typecheck
        run: bun run typecheck

      - name: Run Linter
        run: bun run lint

      - name: Build Bot Dashboard
        run: bun run bot-dashboard:build

      - name: Run Unit Tests
        run: bun test

  deploy:
    name: Deploy to VPS
    needs: validate-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.GCP_HOST }} >> ~/.ssh/known_hosts

      - name: Sync & Deploy Sentinel v2 on VPS
        run: |
          ssh ${{ secrets.GCP_USERNAME }}@${{ secrets.GCP_HOST }} 'bash -s' << 'EOF'
            set -e
            export PATH="$HOME/.bun/bin:$PATH"

            TARGET_DIR="/opt/sentinel-v2"

            if [ ! -d "$TARGET_DIR/.git" ]; then
              echo "Directory $TARGET_DIR does not exist or is not a git repo. Initializing..."
              sudo mkdir -p "$TARGET_DIR"
              sudo chown -R $USER:$USER "$TARGET_DIR"
              git clone https://github.com/ayodejib/sentinel-v2.git "$TARGET_DIR"
            fi

            cd "$TARGET_DIR"
            echo "Pulling latest changes from main..."
            git pull origin main

            echo "Installing dependencies..."
            bun install --production

            echo "Building Bot Dashboard..."
            bun run bot-dashboard:build

            echo "Running SQLite Database Migrations..."
            bun run db:migrate

            echo "Updating Systemd Services..."
            sudo cp .systemd/*.service /etc/systemd/system/
            sudo systemctl daemon-reload
            sudo systemctl enable sentinel-api sentinel-bot sentinel-scheduler
            sudo systemctl restart sentinel-api sentinel-bot sentinel-scheduler
          EOF
