name: Deploy to Production

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "docs/**"
      - ".gitignore"

permissions:
  contents: read
  packages: write

jobs:
  validate-and-test:
    name: Validate & Test
    # Pinned rather than `ubuntu-latest`: this job relies on the runner's
    # preinstalled PostgreSQL 16 (see "Start PostgreSQL" below), so the Ubuntu
    # release is part of the contract, not an incidental detail.
    runs-on: ubuntu-24.04
    # No `services: postgres` container on purpose. Job-level service images are
    # pulled by the runner's Docker daemon *before* any step runs, so they cannot
    # be authenticated from inside the job, and anonymous Docker Hub pulls are
    # capped at 100 per 6 hours per source IP — a quota GitHub-hosted runners
    # share with every other workflow on their Azure egress pool, which surfaced
    # as `toomanyrequests` failures. The runner image already ships PostgreSQL 16
    # (the same major as `postgres:16-alpine`), so the database is started from
    # the host instead and no registry pull happens at all.

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: sentinel_db
      POSTGRES_USER: sentinel_user
      POSTGRES_PASSWORD: sentinel_password

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Kept in lockstep with the `FROM oven/bun:` pin in the Dockerfile so
          # CI and the runtime image cannot drift apart.
          bun-version: 1.4.3

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Typecheck
        run: bun run typecheck

      - name: Run Linter
        run: bun run lint

      - name: Build Web Dashboards
        run: bun run web:build

      - name: Build Userscripts
        run: bun run scripts:build

      - name: Start PostgreSQL
        run: |
          set -euo pipefail
          sudo systemctl start postgresql.service
          # The preinstalled cluster only has the `postgres` superuser, so the
          # role and database the app expects are created here. Auth is
          # scram-sha-256 over TCP, matching POSTGRES_* above.
          sudo -u postgres psql -v ON_ERROR_STOP=1 \
            -c "CREATE USER ${POSTGRES_USER} WITH PASSWORD '${POSTGRES_PASSWORD}';"
          sudo -u postgres psql -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE ${POSTGRES_DB} OWNER ${POSTGRES_USER};"
          # systemctl returns once the unit is up, but the cluster can still be
          # finishing its first start, so wait for a real TCP login before the
          # migration step depends on it.
          for attempt in $(seq 1 15); do
            if PGPASSWORD="${POSTGRES_PASSWORD}" psql \
              -h "${POSTGRES_HOST}" -p "${POSTGRES_PORT}" \
              -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" \
              -c "SELECT 1" >/dev/null 2>&1; then
              echo "PostgreSQL is accepting connections."
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL did not accept a connection within 15s." >&2
          sudo systemctl status postgresql.service --no-pager >&2 || true
          exit 1

      - name: Run Database Migrations
        run: bun run db:migrate

      - name: Run Tests
        run: bun test --parallel=1

  build-and-push:
    name: Build & Push Container Image
    needs: validate-and-test
    runs-on: ubuntu-latest
    env:
      # The builder image the docker-container driver boots. Every CI run pulls
      # it fresh on a cold runner, so it is mirrored into GHCR alongside the Bun
      # base image — see .github/scripts/mirror-image.sh for the seeding chain
      # and why Docker Hub cannot be relied on directly.
      BUILDKIT_IMAGE: moby/buildkit:buildx-stable-1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # The registry login has to come before both the buildx setup (whose
      # builder image is pulled on boot) and the mirroring below, so the GHCR
      # pulls are authenticated rather than anonymous.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure mirrored images exist
        id: mirrors
        run: |
          set -euo pipefail
          # Seeds anything missing in GHCR, preferring Google's Docker Hub cache
          # over Docker Hub itself — see .github/scripts/mirror-image.sh. Once
          # seeded, this is only two manifest lookups against GHCR.
          #
          # GHCR names must be lowercase; a GitHub owner is not guaranteed to be.
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"

          # The Dockerfile is the source of truth for the base image tag, so a Bun
          # bump self-seeds here instead of failing on a tag GHCR has never seen.
          base="$(grep -m1 -oE '^FROM [^ ]+' Dockerfile | awk '{print $2}')"
          bash .github/scripts/mirror-image.sh "oven/bun:${base##*:}" "${base}"

          buildkit_mirror="ghcr.io/${owner}/buildkit:${BUILDKIT_IMAGE##*:}"
          bash .github/scripts/mirror-image.sh "${BUILDKIT_IMAGE}" "${buildkit_mirror}"

          # Hand the builder image to the next step so the driver boots from the
          # mirror rather than pulling moby/buildkit from Docker Hub again.
          echo "buildkit=${buildkit_mirror}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Same image, same tag, relocated to GHCR.
          driver-opts: image=${{ steps.mirrors.outputs.buildkit }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to dejis-cloud
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: dejis-cloud
      SERVER_USER: root
      DEPLOY_DIR: /opt/sentinel-v2

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup Server Directories
        run: |
          ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} "bash -s" << EOF
            set -euo pipefail
            echo "Ensuring deployment directory exists..."
            mkdir -p "${DEPLOY_DIR}"
          EOF

      - name: Sync Docker Compose Configuration
        run: |
          echo "Syncing docker-compose.yml to ${SERVER_HOST}:${DEPLOY_DIR}..."
          scp -o StrictHostKeyChecking=no docker-compose.yml ${SERVER_USER}@${SERVER_HOST}:${DEPLOY_DIR}/docker-compose.yml

      - name: Deploy Containers with Docker Compose
        run: |
          ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} "bash -s" << EOF
            set -euo pipefail
            cd ${DEPLOY_DIR}
            echo "Pulling updated Docker image from ghcr.io..."
            docker compose pull
            echo "Running database migrations..."
            docker compose run -T --rm sentinel-api bun run db:migrate </dev/null
            echo "Recreating containers with updated code..."
            docker compose up -d --remove-orphans
            echo "Checking Sentinel v2 container status..."
            docker compose ps
          EOF

      - name: Health Check Verification
        run: |
          ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} "bash -s" << EOF
            set -euo pipefail
            cd ${DEPLOY_DIR}
            if ! curl -f --retry 10 --retry-delay 2 --retry-connrefused http://localhost:3002/api/health; then
              echo "Healthcheck failed! Dumping container status and logs:"
              docker compose ps
              docker compose logs --tail 50
              exit 1
            fi
            echo "Healthcheck passed successfully!"
          EOF
