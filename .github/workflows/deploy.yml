name: Deploy to Production

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "docs/**"
      - ".gitignore"

jobs:
  validate-and-build:
    name: Validate & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Typecheck
        run: bun run typecheck

      - name: Run Linter
        run: bun run lint

      - name: Build Web Dashboards
        run: bun run web:build

  deploy:
    name: Deploy to dejis-cloud
    needs: validate-and-build
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: dejis-cloud
      SERVER_USER: root
      DEPLOY_DIR: /opt/sentinel-v2

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup Server Directories
        run: |
          ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} "bash -s" << EOF
            set -euo pipefail
            echo "Ensuring deployment directory exists..."
            mkdir -p "${DEPLOY_DIR}"
          EOF

      - name: Sync Application Files
        run: |
          echo "Streaming repository files to ${SERVER_HOST}:${DEPLOY_DIR}..."
          tar -czf - --exclude='.git' --exclude='.env*' --exclude='.github' --exclude='node_modules' . | \
            ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} \
            "tar -xzf - -C ${DEPLOY_DIR}"

      - name: Deploy Containers with Docker Compose
        run: |
          ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} "bash -s" << EOF
            set -euo pipefail
            cd ${DEPLOY_DIR}
            docker compose build --pull
            docker compose up -d --remove-orphans
            echo "Checking Sentinel v2 container status..."
            docker compose ps
          EOF

      - name: Health Check Verification
        run: |
          ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} \
            "curl -f --retry 5 --retry-delay 2 http://localhost:3002/api/health || exit 1"
