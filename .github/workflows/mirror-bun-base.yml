name: Mirror Bun Base Image

# The build pipeline's only third-party pull is the Bun base image. Pulling it
# straight from Docker Hub exposes every build to Docker Hub's anonymous rate
# limit (100 pulls / 6h / source IP, shared across GitHub's runner egress pool)
# and to its auth service occasionally returning 504s, both of which have
# already failed this pipeline. Copying the image into GHCR once means builds
# pull it from GitHub with the credentials they already have.
#
# Normally you never need to run this by hand: the "Build & Push Container
# Image" job mirrors a missing tag on its way to the build. Use this workflow to
# pre-seed the mirror, to repair it, or to check a version without deploying.

on:
  workflow_dispatch:
    inputs:
      bun_version:
        description: "Bun version to mirror. Must match the FROM tag in the Dockerfile."
        required: true
        default: "1.4.2"

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    name: Mirror oven/bun to GHCR
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check the Dockerfile pins the requested version
        run: |
          set -euo pipefail
          # The Dockerfile decides which tag the build needs, so mirroring a
          # different version would silently leave the build on a stale image.
          pinned="$(grep -m1 -oE '^FROM [^ ]+' Dockerfile | awk '{print $2}' | sed -E 's/.*://')"
          if [ "$pinned" != "${{ inputs.bun_version }}" ]; then
            echo "The Dockerfile uses Bun ${pinned} but this run mirrors ${{ inputs.bun_version }}." >&2
            echo "Mirror ${pinned}, or bump the Dockerfile, deploy.yml's bun-version and this default together." >&2
            exit 1
          fi
          echo "Dockerfile pins Bun ${pinned}."

      - name: Resolve image names
        id: names
        run: |
          set -euo pipefail
          # GHCR repository names must be lowercase; a GitHub owner is not
          # guaranteed to be.
          owner="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "source=oven/bun:${{ inputs.bun_version }}"
            echo "target=ghcr.io/${owner}/bun-base:${{ inputs.bun_version }}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy the image into GHCR
        run: |
          set -euo pipefail
          docker pull "${{ steps.names.outputs.source }}"
          docker tag "${{ steps.names.outputs.source }}" "${{ steps.names.outputs.target }}"
          docker push "${{ steps.names.outputs.target }}"

      - name: Verify the mirror is pullable
        run: |
          set -euo pipefail
          docker manifest inspect "${{ steps.names.outputs.target }}" > /dev/null
          echo "Mirrored ${{ steps.names.outputs.source }} -> ${{ steps.names.outputs.target }}"
